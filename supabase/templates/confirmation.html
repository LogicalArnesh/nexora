<!doctype html>
<html lang="en">
  <body style="margin:0;background:#09090f;padding:28px 14px;font-family:Segoe UI,Arial,sans-serif;color:#f4f4f5">
    <main style="max-width:520px;margin:0 auto;border:1px solid #292638;border-radius:16px;overflow:hidden;background:#111019">
      <header style="padding:22px 26px;background:linear-gradient(120deg,#20143d,#141c38);border-bottom:1px solid #302a45">
        <p style="margin:0;color:#c4b5fd;font-size:12px;font-weight:700;letter-spacing:2px">NEXORA · TWOTANY</p>
        <h1 style="margin:12px 0 0;color:#fff;font-size:22px">Confirm your email</h1>
      </header>
      <section style="padding:26px;color:#d4d4d8;line-height:1.7">
        <p>Welcome to Nexora. Confirm your address to finish creating your workspace.</p>
        <p style="margin:0 0 8px;font-size:12px;color:#a1a1aa;letter-spacing:1px;text-transform:uppercase">Confirmation code</p>
        <div style="padding:16px;border:1px solid #42356a;border-radius:12px;background:#181427;text-align:center;color:#fff;font-size:28px;font-weight:800;letter-spacing:8px">{{ .Token }}</div>
        <p style="margin:22px 0 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#7857e8;color:#fff;text-decoration:none;font-weight:700">Confirm email</a></p>
        <p style="color:#a1a1aa;font-size:13px">New members receive 50,000 Nexora Tokens. Admins are unlimited.</p>
      </section>
      <footer style="padding:14px 26px;background:#0b0a10;color:#71717a;font-size:11px">Nexora automated notice.</footer>
    </main>
  </body>
</html>
