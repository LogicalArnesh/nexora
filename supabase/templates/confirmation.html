<!doctype html>
<html lang="en">
  <body style="margin:0;background:#09090f;padding:28px 14px;font-family:Arial,sans-serif;color:#f4f4f5">
    <main style="max-width:520px;margin:0 auto;border:1px solid #292638;border-radius:16px;overflow:hidden;background:#111019">
      <header style="padding:22px 26px;background:#171329;border-bottom:1px solid #302a45">
        <p style="margin:0;color:#c4b5fd;font-size:12px;font-weight:700;letter-spacing:2px">NEXORA</p>
        <h1 style="margin:12px 0 0;color:#fff;font-size:22px">Confirm your email</h1>
      </header>
      <section style="padding:26px;color:#d4d4d8;line-height:1.7">
        <p>Confirm your email address to finish setting up your Nexora account.</p>
        <p style="margin:22px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#7857e8;color:#fff;text-decoration:none;font-weight:700">Confirm email</a></p>
        <p style="color:#a1a1aa;font-size:13px">If you did not create this account, you can ignore this email.</p>
      </section>
    </main>
  </body>
</html>
