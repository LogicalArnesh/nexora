<!doctype html>
<html lang="en">
  <body style="margin:0;background:#09090f;padding:28px 14px;font-family:Arial,sans-serif;color:#f4f4f5">
    <main style="max-width:520px;margin:0 auto;border:1px solid #292638;border-radius:16px;overflow:hidden;background:#111019">
      <header style="padding:22px 26px;background:#171329;border-bottom:1px solid #302a45">
        <p style="margin:0;color:#c4b5fd;font-size:12px;font-weight:700;letter-spacing:2px">NEXORA</p>
        <h1 style="margin:12px 0 0;color:#fff;font-size:22px">Your sign-in code</h1>
      </header>
      <section style="padding:26px">
        <p style="margin:0 0 18px;color:#d4d4d8;line-height:1.6">Use this one-time code to sign in. Do not share it with anyone.</p>
        <div style="padding:18px;border:1px solid #42356a;border-radius:12px;background:#181427;text-align:center;color:#fff;font-size:32px;font-weight:800;letter-spacing:9px">{{ .Token }}</div>
        <p style="margin:18px 0 0;color:#a1a1aa;font-size:13px;line-height:1.6">If you did not request this code, you can ignore this email.</p>
      </section>
    </main>
  </body>
</html>
